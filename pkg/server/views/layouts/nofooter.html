<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ .Title }}</title>
    <link rel="icon" type="image/x-icon" href="/assets/static/img/favicons/favicon.ico">
    <link rel="manifest" href="/assets/static/site.webmanifest"/>

    <!-- Tailwind CSS -->
    <script src="/assets/js/tailwind.js"></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100..900" rel="stylesheet">

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    // theme extensions here
                },
                fontFamily: {
                    sans: ['Lexend Deca', 'sans-serif'],
                    serif: ['Lexend Deca', 'serif'],
                },
            },
        }
    </script>
</head>

<body class="min-h-screen flex flex-col bg-gray-100 dark:bg-gray-900">

    <noscript>
        <h1>You need to enable JavaScript to run this webapp.</h1>
    </noscript>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

    <!-- Global i18n -->
    <script src="/assets/js/i18n.js"></script>

    <!-- Points -->
    <script src="/assets/js/points.js"></script>

    <!-- Navbar -->
    {{ template "navbar_default" . }}

    <!-- Main content -->
    <main id="main" class="flex-grow bg-gray-100 dark:bg-gray-900">
        {{ embed }}
    </main>

    <!-- Modal container -->
    <div id="modalContainer" class="relative z-50"></div>

    <!-- Loading overlay -->
    <div id="loadingOverlay" class="hidden fixed inset-0 bg-black/75 flex justify-center items-center z-50">
        <div class="animate-spin rounded-full h-12 w-12 border-4 border-white border-t-transparent"></div>
    </div>

    <!-- Achievement toast container -->
    <div id="achievementToastContainer" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Theme toggle -->
    <script src="/assets/js/color-modes.js"></script>

    <script>
    (function() {
      const STORAGE_KEY = 'last_seen_achievement_id';
      const toastContainer = document.getElementById('achievementToastContainer');
      if (!toastContainer) return;

      async function checkNewAchievement() {
        try {
          const res = await fetch('/api/v1/achievements');
          if (res.status === 401 || res.status === 403) return;
          if (!res.ok) return;

          const data = await res.json();
          if (!res.ok || data.result !== 'OK' || !Array.isArray(data.data) || data.data.length === 0) return;

          const latest = data.data[0];
          const lastSeenId = localStorage.getItem(STORAGE_KEY);

          if (latest.id && latest.id !== lastSeenId) {
            showAchievementToast(latest);
            localStorage.setItem(STORAGE_KEY, latest.id);
          }
        } catch (e) {
          // ignore
        }
      }

      function showAchievementToast(achievement) {
        const rawIconUrl = achievement.icon && achievement.icon.link ? achievement.icon.link : '/assets/static/img/ui/placeholder_achievement.png';
        const iconUrl = String(rawIconUrl).replace(/`/g, '\\`').replace(/\$\{/g, '\\${');
        const gameName = achievement.developer_game && achievement.developer_game.name ? achievement.developer_game.name : 'Unknown Game';
        const description = achievement.description || 'Achievement unlocked';
        const points = achievement.points || 0;
        const createdAt = achievement.created_at ? new Date(achievement.created_at).toLocaleString() : '';

        const toast = document.createElement('div');
        toast.className = 'pointer-events-auto bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg shadow-lg p-4 flex items-start gap-3 transform translate-y-4 opacity-0 transition-all duration-300 ease-out';
        toast.innerHTML = `
          <div class="flex-shrink-0">
            <img src="${iconUrl}" alt="Achievement" class="w-12 h-12 rounded object-cover" onerror="this.src='/assets/static/img/ui/placeholder_achievement.png'">
          </div>
          <div class="flex-1">
            <p class="text-xs font-semibold text-red-500 dark:text-red-400 uppercase tracking-wide">Achievement Unlocked</p>
            <p class="text-sm font-semibold text-gray-900 dark:text-white">${escapeHtml(description)}</p>
            <p class="text-xs text-gray-600 dark:text-gray-300">${escapeHtml(gameName)} &middot; ${points} points &middot; ${createdAt}</p>
          </div>
        `;

        toastContainer.appendChild(toast);

        requestAnimationFrame(() => {
          toast.classList.remove('translate-y-4', 'opacity-0');
        });

        setTimeout(() => {
          toast.classList.add('translate-y-4', 'opacity-0');
          setTimeout(() => {
            if (toast.parentNode) {
              toast.parentNode.removeChild(toast);
            }
          }, 300);
        }, 5000);
      }

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        let html = div.innerHTML;
        html = html.replace(/`/g, '\\`').replace(/\$\{/g, '\\${');
        return html;
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', checkNewAchievement);
      } else {
        checkNewAchievement();
      }
    })();
    </script>

    <script type="text/javascript" src="/assets/js/navbar.js"></script>
</body>

</html>
