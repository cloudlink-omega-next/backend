  <!-- Main Content -->

    <h1 class="text-3xl font-semibold mb-6" data-i18n="achievements_title">Achievements</h1>

    <div id="achievements-list" class="space-y-4">
      <p class="text-gray-600 dark:text-gray-300" data-i18n="achievements_loading">Loading achievements...</p>
    </div>
  </main>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  applyI18n();

  (async function() {
    try {
      const res = await fetch('/api/v1/achievements');
      if (res.status === 401 || res.status === 403) {
        window.location.href = '/accounts/login?redirect=/dashboard/achievements';
        return;
      }
      const data = await res.json();
      const container = document.getElementById('achievements-list');

      if (!res.ok || data.result !== 'OK' || !Array.isArray(data.data) || data.data.length === 0) {
        container.innerHTML = '<p class="text-gray-600 dark:text-gray-300" data-i18n="achievements_none">No achievements yet. Play games to earn achievements!</p>';
        applyI18n();
        return;
      }

      container.innerHTML = '';

      for (const achievement of data.data) {
        const item = document.createElement('div');
        item.className = 'border rounded p-4 bg-white dark:bg-gray-800 flex items-start gap-4';

        const rawIconUrl = achievement.icon && achievement.icon.link ? achievement.icon.link : '/assets/static/img/ui/placeholder_achievement.png';
        const iconUrl = String(rawIconUrl).replace(/`/g, '\\`').replace(/\$\{/g, '\\${');

        item.innerHTML = `
          <div class="flex-shrink-0">
            <img src="${iconUrl}" alt="Achievement icon" class="w-16 h-16 rounded object-cover" onerror="this.src='/assets/static/img/ui/placeholder_achievement.png'">
          </div>
          <div class="flex-1">
            <h3 class="text-lg font-semibold text-gray-800 dark:text-white">${escapeHtml(achievement.description)}</h3>
            <p class="text-sm text-gray-600 dark:text-gray-300">${achievement.developer_game ? escapeHtml(achievement.developer_game.name) : 'Unknown Game'}</p>
            <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">${achievement.points} <span data-i18n="achievements_points">points</span> &middot; ${formatDate(achievement.created_at)}</p>
          </div>
        `;
        container.appendChild(item);
      }
    } catch (e) {
      window.location.href = '/accounts/login?redirect=/dashboard/achievements';
    }
    applyI18n();
  })();

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    let html = div.innerHTML;
    html = html.replace(/`/g, '\\`').replace(/\$\{/g, '\\${');
    return html;
  }

  function formatDate(dateStr) {
    if (!dateStr) return '';
    const date = new Date(dateStr);
    return date.toLocaleString();
  }
});
</script>
